<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - {{ .ShopName }}</title>
    <!-- <link rel="stylesheet" href="/static/style.css"> -->
    <style>
        body {
            margin: 0;
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .auth-card {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.08);
            border: 1px solid #e2e8f0;
            width: 100%;
            max-width: 420px;
        }
        .brand {
            font-size: 1.5rem;
            font-weight: 800;
            color: #2563eb;
            text-decoration: none;
            display: block;
            text-align: center;
            margin-bottom: 24px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 700;
            color: #475569;
            margin-bottom: 6px;
        }
        .form-control {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 0.95ln;
            box-sizing: border-box;
        }
        .form-control:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }
        .btn-primary {
            width: 100%;
            padding: 12px;
            background: #2563eb;
            color: white;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            font-size: 1rem;
            transition: background 0.2s ease;
        }
        .btn-primary:hover {
            background: #1d4ed8;
        }
        .error-alert {
            background: #fee2e2;
            border: 1px solid #f87171;
            color: #991b1b;
            padding: 10px 14px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 0.9rem;
            font-weight: 600;
        }
        .auth-footer {
            text-align: center;
            margin-top: 24px;
            font-size: 0.9rem;
            color: #475569;
        }
        .auth-footer a {
            color: #2563eb;
            text-decoration: none;
            font-weight: 700;
        }
    </style>
</head>
<body>

    <div class="auth-card">
        <a href="/" class="brand">🧺 {{ .ShopName }}</a>
        <h2 style="margin-top: 0; margin-bottom: 6px; font-size: 1.5rem;">Welcome Back</h2>
        <p style="color: #475569; font-size: 0.9rem; margin-top: 0; margin-bottom: 24px;">Sign in to access your dashboard and track orders.</p>

        {{ if .LoginError }}
        <div class="error-alert">
            ⚠️ {{ .LoginError }}
        </div>
        {{ end }}

        <form action="/login-customer" method="POST">
            <div class="form-group">
                <label>Email or Phone Number</label>
                <input type="text" name="identifier" value="{{ .Identifier }}" placeholder="e.g. 08031234567 or email" class="form-control" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="Enter your password" class="form-control" required>
            </div>
            <button type="submit" class="btn-primary">
                Sign In
            </button>
        </form>

        <div class="auth-footer">
            Don't have an account? <a href="/signup">Create one</a><br>
            <a href="/" style="display: inline-block; margin-top: 12px; color: #64748b; font-weight: normal;">&larr; Back to Home</a>
        </div>
    </div>

</body>
</html>
